<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maligai Shop</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f3f4f6;
  color:#222;
}
header{
  background:#2563eb;
  color:white;
  text-align:center;
  padding:20px 10px;
}
h1{margin:0;font-size:28px}
.container{max-width:600px;margin:auto;padding:15px}
.card{
  background:white;
  padding:18px;
  margin-bottom:16px;
  border-radius:14px;
  box-shadow:0 2px 8px #ddd;
}
input{
  width:100%;
  padding:14px;
  margin:6px 0;
  border:1px solid #ccc;
  border-radius:9px;
  font-size:17px;
}
.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
button{
  width:100%;
  padding:14px;
  margin-top:8px;
  border:0;
  border-radius:9px;
  background:#2563eb;
  color:white;
  font-size:17px;
  font-weight:bold;
}
.product{
  padding:12px 0;
  border-bottom:1px solid #ddd;
}
.product:last-child{border-bottom:0}
.price{color:#16a34a;font-weight:bold}
.stock{color:#555}
.delete{background:#dc2626}
.sale{background:#16a34a}
.total{
  font-size:24px;
  font-weight:bold;
  color:#2563eb;
}
</style>
</head>

<body>

<header>
<h1>🛒 Maligai Shop</h1>
<div>மளிகை கடை கணக்கு</div>
</header>

<div class="container">

<div class="card">
<h2>➕ பொருள் சேர்க்க</h2>

<input id="productName" type="text" placeholder="பொருள் பெயர்">

<div class="row">
<input id="productPrice" type="number" placeholder="விலை ₹">
<input id="productStock" type="number" placeholder="Stock">
</div>

<button id="addProductBtn">பொருள் சேர்க்க</button>
</div>

<div class="card">
<h2>🔍 பொருட்கள்</h2>

<input id="searchBox" type="text" placeholder="பொருளை Search செய்ய...">

<div id="productList"></div>
</div>

<div class="card">
<h2>🧾 விற்பனை</h2>

<input id="saleName" type="text" placeholder="பொருள் பெயர்">

<div class="row">
<input id="saleQty" type="number" placeholder="Quantity">
<input id="salePrice" type="number" placeholder="விலை ₹">
</div>

<button id="saleBtn" class="sale">விற்பனை பதிவு</button>
</div>

<div class="card">
<h2>📊 இன்றைய விற்பனை</h2>

<div class="total">₹ <span id="totalAmount">0</span></div>

<div id="salesList"></div>
</div>

</div>

<script>

let products = [];
let sales = [];

try{
  products = JSON.parse(localStorage.getItem("maligai_products") || "[]");
  sales = JSON.parse(localStorage.getItem("maligai_sales") || "[]");
}catch(e){
  products=[];
  sales=[];
}

function saveData(){
  localStorage.setItem("maligai_products",JSON.stringify(products));
  localStorage.setItem("maligai_sales",JSON.stringify(sales));
}

function showProducts(){

  const search =
    document.getElementById("searchBox").value
    .trim()
    .toLowerCase();

  const list = products.filter(p =>
    p.name.toLowerCase().includes(search)
  );

  const box = document.getElementById("productList");

  if(list.length === 0){
    box.innerHTML = "<p>பொருட்கள் எதுவும் இல்லை.</p>";
    return;
  }

  box.innerHTML = "";

  list.forEach(p => {

    const div = document.createElement("div");
    div.className = "product";

    div.innerHTML = `
      <b>${p.name}</b><br>
      <span class="price">₹${p.price}</span>
      &nbsp; | &nbsp;
      <span class="stock">Stock: ${p.stock}</span>

      <button class="edit" data-id="${p.id}">
        ✏️ Edit
      </button>

      <button class="delete" data-id="${p.id}">
        Delete
      </button>
    `;

    box.appendChild(div);
  });

  document.querySelectorAll(".edit").forEach(btn => {

    btn.addEventListener("click", function(){

      const id = Number(this.dataset.id);
      const product = products.find(p => p.id === id);

      if(!product) return;

      const newPrice = prompt(
        "புதிய விலை ₹",
        product.price
      );

      if(newPrice === null) return;

      const newStock = prompt(
        "புதிய Stock",
        product.stock
      );

      if(newStock === null) return;

      product.price = Number(newPrice);
      product.stock = Number(newStock);

      saveData();
      showProducts();

      alert("பொருள் விவரம் மாற்றப்பட்டது ✅");
    });
  });

  document.querySelectorAll(".delete").forEach(btn => {

    btn.addEventListener("click", function(){

      const id = Number(this.dataset.id);

      products = products.filter(p => p.id !== id);

      saveData();
      showProducts();

    });
  });
}

document.getElementById("addProductBtn")
.addEventListener("click",function(){

  const name=document
    .getElementById("productName")
    .value
    .trim();

  const price=Number(
    document.getElementById("productPrice").value
  );

  const stock=Number(
    document.getElementById("productStock").value
  );

  if(name===""){
    alert("பொருள் பெயரை உள்ளிடுங்கள்");
    return;
  }

  if(price<=0){
    alert("விலையை உள்ளிடுங்கள்");
    return;
  }

  if(stock<0){
    alert("Stock சரியாக உள்ளிடுங்கள்");
    return;
  }

  products.push({
    id:Date.now(),
    name:name,
    price:price,
    stock:stock
  });

  saveData();

  document.getElementById("productName").value="";
  document.getElementById("productPrice").value="";
  document.getElementById("productStock").value="";

  showProducts();

  alert("பொருள் வெற்றிகரமாக சேர்க்கப்பட்டது ✅");
});

document.getElementById("searchBox")
.addEventListener("input",showProducts);

document.getElementById("saleBtn")
.addEventListener("click",function(){

  const name=document
    .getElementById("saleName")
    .value
    .trim();

  const qty=Number(
    document.getElementById("saleQty").value
  );

  const price=Number(
    document.getElementById("salePrice").value
  );

  if(name===""){
    alert("பொருள் பெயரை உள்ளிடுங்கள்");
    return;
  }

  if(qty<=0 || price<=0){
    alert("Quantity மற்றும் விலையை சரியாக உள்ளிடுங்கள்");
    return;
  }

  const product=products.find(
    p=>p.name.toLowerCase()===name.toLowerCase()
  );

  if(product && product.stock<qty){
    alert("போதுமான Stock இல்லை");
    return;
  }

  if(product){
    product.stock-=qty;
  }

  sales.push({
    name:name,
    qty:qty,
    amount:qty*price,
    date:new Date().toISOString()
  });

  saveData();

  document.getElementById("saleName").value="";
  document.getElementById("saleQty").value="";
  document.getElementById("salePrice").value="";

  showProducts();
  showSales();

  alert("விற்பனை பதிவு செய்யப்பட்டது ✅");
});

function showSales(){

  const today=new Date()
    .toISOString()
    .slice(0,10);

  const todaySales=sales.filter(
    s=>s.date.slice(0,10)===today
  );

  let total=0;

  todaySales.forEach(s=>{
    total+=s.amount;
  });

  document.getElementById("totalAmount")
    .textContent=total;

  const box=document.getElementById("salesList");

  if(todaySales.length===0){
    box.innerHTML="<p>இன்று விற்பனை இல்லை.</p>";
    return;
  }

  box.innerHTML="";

  todaySales.slice().reverse().forEach(s=>{

    const div=document.createElement("div");

    div.className="product";

    div.innerHTML=
      `<b>${s.name}</b><br>
       Qty: ${s.qty} |
       ₹${s.amount}`;

    box.appendChild(div);
  });
}

showProducts();
showSales();

</script>

</body>
</html>
